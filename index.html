<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Vital PWA Meta Tags -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bulmi - SHG Podupu Sangam App</title>
  
  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#047857">
  <link rel="apple-touch-icon" href="./icons/icon-192x192.png">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom animations mapped to the Tailwind classes used in the code */
    .animate-in.fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* Ensure clean printing */
    @media print {
      body {
        background-color: white !important;
      }
      .print\:hidden {
        display: none !important;
      }
      .print\:block {
        display: block !important;
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-emerald-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ==========================================
    // ICONS (Replacing lucide-react dependencies)
    // ==========================================
    const SVG = ({ children, size=24, className="", style={} }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}>
        {children}
      </svg>
    );
    const Users = (p) => <SVG {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></SVG>;
    const Calendar = (p) => <SVG {...p}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></SVG>;
    const IndianRupee = (p) => <SVG {...p}><path d="M6 3h12"/><path d="M6 8h12"/><path d="m6 13 8.5 8"/><path d="M6 13h3"/><path d="M9 13c6.667 0 6.667-10 0-10"/></SVG>;
    const TrendingUp = (p) => <SVG {...p}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></SVG>;
    const FileText = (p) => <SVG {...p}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></SVG>;
    const Plus = (p) => <SVG {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></SVG>;
    const ArrowLeft = (p) => <SVG {...p}><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></SVG>;
    const AlertCircle = (p) => <SVG {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></SVG>;
    const Trash2 = (p) => <SVG {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></SVG>;
    const Printer = (p) => <SVG {...p}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></SVG>;
    const CreditCard = (p) => <SVG {...p}><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></SVG>;
    const Calculator = (p) => <SVG {...p}><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></SVG>;

    // ==========================================
    // UTILITY FUNCTIONS
    // ==========================================
    const formatCurrency = (amount) => {
      return new Intl.NumberFormat('en-IN', {
        style: 'currency',
        currency: 'INR',
        minimumFractionDigits: 0,
        maximumFractionDigits: 0,
      }).format(amount || 0);
    };

    const calculateDays = (start, end) => {
      const diffTime = Math.abs(new Date(end) - new Date(start));
      return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    };

    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================
    function App() {
      // Global State & Persistence
      const [group, setGroup] = useState(() => JSON.parse(localStorage.getItem('shg_group')) || null);
      const [loans, setLoans] = useState(() => JSON.parse(localStorage.getItem('shg_loans')) || []);
      const [members, setMembers] = useState(() => JSON.parse(localStorage.getItem('shg_members')) || []);
      const [payments, setPayments] = useState(() => JSON.parse(localStorage.getItem('shg_payments')) || []);

      // Navigation State
      const [currentView, setCurrentView] = useState(group ? 'dashboard' : 'setup');
      const [activeLoanId, setActiveLoanId] = useState(null);
      const [printData, setPrintData] = useState(null);

      // Sync to localStorage
      useEffect(() => { localStorage.setItem('shg_group', JSON.stringify(group)); }, [group]);
      useEffect(() => { localStorage.setItem('shg_loans', JSON.stringify(loans)); }, [loans]);
      useEffect(() => { localStorage.setItem('shg_members', JSON.stringify(members)); }, [members]);
      useEffect(() => { localStorage.setItem('shg_payments', JSON.stringify(payments)); }, [payments]);

      // Handle Printing side-effect
      useEffect(() => {
        if (printData) {
          window.print();
          setTimeout(() => setPrintData(null), 500); 
        }
      }, [printData]);

      if (printData) {
        return <PrintLedger data={printData} groupName={group?.name} />;
      }

      if (currentView === 'setup') {
        return <GroupSetup onComplete={(data) => { setGroup(data); setCurrentView('dashboard'); }} />;
      }

      if (currentView === 'create_loan') {
        return (
          <CreateLoan 
            onCancel={() => setCurrentView('dashboard')}
            onSave={(loanData, membersData) => {
              setLoans([...loans, loanData]);
              setMembers([...members, ...membersData]);
              setCurrentView('dashboard');
            }}
          />
        );
      }

      if (currentView === 'loan_view' && activeLoanId) {
        const activeLoan = loans.find(l => l.id === activeLoanId);
        const loanMembers = members.filter(m => m.loanId === activeLoanId);
        const loanPayments = payments.filter(p => p.loanId === activeLoanId);
        
        return (
          <LoanManager 
            group={group}
            loan={activeLoan} 
            members={loanMembers} 
            payments={loanPayments}
            onBack={() => { setActiveLoanId(null); setCurrentView('dashboard'); }}
            onAddPayment={(payment) => setPayments([...payments, payment])}
            onDeletePayment={(pid) => setPayments(payments.filter(p => p.id !== pid))}
            onPrintLedger={(memberId) => {
              const member = loanMembers.find(m => m.id === memberId);
              const mPayments = loanPayments.filter(p => p.memberId === memberId).sort((a,b) => new Date(a.date) - new Date(b.date));
              setPrintData({ loan: activeLoan, member, payments: mPayments });
            }}
          />
        );
      }

      return (
        <Dashboard 
          group={group} 
          loans={loans} 
          payments={payments}
          onCreateLoan={() => setCurrentView('create_loan')}
          onOpenLoan={(id) => { setActiveLoanId(id); setCurrentView('loan_view'); }}
        />
      );
    }

    // ==========================================
    // 1. GROUP SETUP VIEW
    // ==========================================
    function GroupSetup({ onComplete }) {
      const handleSubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        onComplete({
          name: fd.get('name'),
          createdAt: fd.get('createdAt'),
          initialSavings: Number(fd.get('initialSavings')),
        });
      };

      return (
        <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
          <div className="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border border-emerald-100">
            <div className="flex justify-center mb-6">
              <div className="bg-emerald-100 p-4 rounded-full text-emerald-700">
                <Users size={32} />
              </div>
            </div>
            <h1 className="text-2xl font-bold text-center text-slate-800 mb-2">Create Bulmi Group</h1>
            <p className="text-center text-slate-500 mb-8 text-sm">Set up your Podupu Sangam details to get started.</p>
            
            <form onSubmit={handleSubmit} className="space-y-5">
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Group Name</label>
                <input required name="name" type="text" placeholder="e.g. Mahila Shakti Sangam" className="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none" />
              </div>
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Date of Creation</label>
                <input required name="createdAt" type="date" defaultValue={new Date().toISOString().split('T')[0]} className="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none" />
              </div>
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Initial Group Savings (₹)</label>
                <input required name="initialSavings" type="number" min="0" defaultValue="0" className="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none" />
              </div>
              <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl transition-all shadow-md hover:shadow-lg">
                Create Group
              </button>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // 2. DASHBOARD VIEW
    // ==========================================
    function Dashboard({ group, loans, payments, onCreateLoan, onOpenLoan }) {
      const stats = useMemo(() => {
        const totalSavingsPaid = payments.reduce((sum, p) => sum + Number(p.savingsPaid), 0);
        const totalGroupSavings = (group?.initialSavings || 0) + totalSavingsPaid;
        const activeLoans = loans.length;
        const totalLoansGiven = loans.reduce((sum, l) => sum + Number(l.totalAmount), 0);
        const totalLoansRecovered = payments.reduce((sum, p) => sum + Number(p.loanPaid), 0);

        return { totalGroupSavings, activeLoans, totalLoansGiven, totalLoansRecovered };
      }, [group, loans, payments]);

      return (
        <div className="min-h-screen bg-slate-50 pb-20 p-4 md:p-8">
          <div className="max-w-5xl mx-auto space-y-6">
            <div className="bg-emerald-700 rounded-3xl p-6 md:p-8 text-white shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div>
                <h1 className="text-2xl md:text-4xl font-bold mb-2">{group?.name}</h1>
                <p className="text-emerald-100 flex items-center gap-2">
                  <Calendar size={16} /> Est. {new Date(group?.createdAt).toLocaleDateString('en-IN')}
                </p>
              </div>
              <div className="bg-emerald-800/50 p-4 rounded-2xl border border-emerald-600/50 backdrop-blur-sm">
                <p className="text-emerald-100 text-sm mb-1">Total Group Savings</p>
                <p className="text-3xl font-bold">{formatCurrency(stats.totalGroupSavings)}</p>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <StatCard title="Total Loans Given" amount={stats.totalLoansGiven} icon={<IndianRupee />} color="blue" />
              <StatCard title="Total Recovered" amount={stats.totalLoansRecovered} icon={<TrendingUp />} color="emerald" />
              <StatCard title="Active Loan Records" amount={stats.activeLoans} isCount icon={<FileText />} color="purple" />
            </div>

            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
              <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h2 className="text-xl font-bold text-slate-800">Group Loans</h2>
                <button onClick={onCreateLoan} className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-medium flex items-center gap-2 transition-colors">
                  <Plus size={18} /> New Loan
                </button>
              </div>
              
              <div className="p-0">
                {loans.length === 0 ? (
                  <div className="p-12 text-center text-slate-500">
                    <div className="flex justify-center mb-4 text-slate-300"><FileText size={48} /></div>
                    <p>No loans created yet. Click 'New Loan' to start.</p>
                  </div>
                ) : (
                  <div className="divide-y divide-slate-100">
                    {loans.map(loan => {
                      const loanPayments = payments.filter(p => p.loanId === loan.id);
                      const recovered = loanPayments.reduce((sum, p) => sum + Number(p.loanPaid), 0);
                      const progress = Math.min(100, Math.round((recovered / loan.totalAmount) * 100));

                      return (
                        <div key={loan.id} onClick={() => onOpenLoan(loan.id)} className="p-6 hover:bg-slate-50 cursor-pointer transition-colors flex flex-col md:flex-row justify-between gap-4 items-center">
                          <div className="flex-1 w-full">
                            <h3 className="font-bold text-lg text-slate-800">{loan.name}</h3>
                            <p className="text-sm text-slate-500 mb-2">Started: {new Date(loan.startDate).toLocaleDateString('en-IN')}</p>
                            <div className="w-full bg-slate-200 rounded-full h-2.5">
                              <div className="bg-emerald-600 h-2.5 rounded-full" style={{ width: `${progress}%` }}></div>
                            </div>
                          </div>
                          <div className="text-right flex-shrink-0 w-full md:w-auto flex md:block justify-between items-end">
                             <p className="text-sm text-slate-500">Amount</p>
                             <p className="font-bold text-xl text-slate-800">{formatCurrency(loan.totalAmount)}</p>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 3. CREATE LOAN VIEW
    // ==========================================
    function CreateLoan({ onCancel, onSave }) {
      const [loanName, setLoanName] = useState('');
      const [totalAmount, setTotalAmount] = useState('');
      const [startDate, setStartDate] = useState(new Date().toISOString().split('T')[0]);
      
      const [tempMembers, setTempMembers] = useState([]);
      const [error, setError] = useState('');

      const addTempMember = () => {
        setTempMembers([...tempMembers, { id: Date.now().toString(), name: '', loanShare: '', targetSavings: '' }]);
      };

      const updateTempMember = (id, field, value) => {
        setTempMembers(tempMembers.map(m => m.id === id ? { ...m, [field]: value } : m));
      };

      const removeTempMember = (id) => {
        setTempMembers(tempMembers.filter(m => m.id !== id));
      };

      const handleSave = () => {
        if (!loanName || !totalAmount) return setError("Please fill loan details.");
        if (tempMembers.length === 0) return setError("Add at least one member.");
        
        const currentAllocated = tempMembers.reduce((sum, m) => sum + Number(m.loanShare || 0), 0);
        if (currentAllocated !== Number(totalAmount)) {
          return setError(`Total allocations (${currentAllocated}) must equal Loan Amount (${totalAmount}).`);
        }

        const hasEmptyNames = tempMembers.some(m => !m.name.trim());
        if (hasEmptyNames) return setError("All members must have names.");

        const loanId = Date.now().toString();
        const newLoan = { id: loanId, name: loanName, totalAmount: Number(totalAmount), startDate };
        const newMembers = tempMembers.map(m => ({
          id: m.id,
          loanId,
          name: m.name,
          loanShare: Number(m.loanShare),
          targetSavings: Number(m.targetSavings)
        }));

        onSave(newLoan, newMembers);
      };

      const currentAllocated = tempMembers.reduce((sum, m) => sum + Number(m.loanShare || 0), 0);
      const allocationDiff = Number(totalAmount || 0) - currentAllocated;

      return (
        <div className="min-h-screen bg-slate-50 p-4 md:p-8">
          <div className="max-w-4xl mx-auto space-y-6">
            <button onClick={onCancel} className="flex items-center gap-2 text-slate-500 hover:text-emerald-700 transition-colors">
              <ArrowLeft size={20} /> Back to Dashboard
            </button>

            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
              <div className="p-6 border-b border-slate-100 bg-slate-50">
                <h2 className="text-2xl font-bold text-slate-800">Create New Loan</h2>
                <p className="text-slate-500 text-sm">Define the loan and allocate amounts to members.</p>
              </div>

              <div className="p-6 space-y-6">
                {error && <div className="bg-red-50 text-red-600 p-4 rounded-xl flex items-center gap-2 border border-red-100"><AlertCircle size={20}/> {error}</div>}
                
                <div className="grid md:grid-cols-3 gap-4">
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">Loan Name</label>
                    <input value={loanName} onChange={e => setLoanName(e.target.value)} type="text" placeholder="e.g. 2026 Bank Loan" className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">Total Loan Amount (₹)</label>
                    <input value={totalAmount} onChange={e => setTotalAmount(e.target.value)} type="number" min="0" className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">Start Date</label>
                    <input value={startDate} onChange={e => setStartDate(e.target.value)} type="date" className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" />
                  </div>
                </div>

                <div className="border-t border-slate-200 pt-6">
                  <div className="flex justify-between items-center mb-4">
                    <h3 className="text-lg font-bold text-slate-800">Member Allocations</h3>
                    <div className={`text-sm font-medium px-3 py-1 rounded-full ${allocationDiff === 0 ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`}>
                      Remaining to Allocate: {formatCurrency(allocationDiff)}
                    </div>
                  </div>

                  <div className="space-y-3">
                    {tempMembers.map((m, index) => (
                      <div key={m.id} className="flex flex-col md:flex-row gap-3 items-end p-4 bg-slate-50 rounded-xl border border-slate-100">
                        <div className="w-full md:w-1/3">
                          <label className="block text-xs font-medium text-slate-500 mb-1">Member {index + 1} Name</label>
                          <input value={m.name} onChange={e => updateTempMember(m.id, 'name', e.target.value)} type="text" className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                        </div>
                        <div className="w-full md:w-1/3">
                          <label className="block text-xs font-medium text-slate-500 mb-1">Loan Share (₹)</label>
                          <input value={m.loanShare} onChange={e => updateTempMember(m.id, 'loanShare', e.target.value)} type="number" className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                        </div>
                        <div className="w-full md:w-1/3">
                          <label className="block text-xs font-medium text-slate-500 mb-1">Monthly Savings Target (₹)</label>
                          <input value={m.targetSavings} onChange={e => updateTempMember(m.id, 'targetSavings', e.target.value)} type="number" className="w-full p-2 border border-slate-300 rounded-lg outline-none" />
                        </div>
                        <button onClick={() => removeTempMember(m.id)} className="p-2.5 text-red-500 hover:bg-red-100 rounded-lg transition-colors">
                          <Trash2 size={20} />
                        </button>
                      </div>
                    ))}
                  </div>
                  
                  <button onClick={addTempMember} className="mt-4 text-emerald-600 hover:text-emerald-700 font-medium flex items-center gap-1">
                    <Plus size={18} /> Add Member
                  </button>
                </div>
                
                <div className="flex justify-end pt-4">
                  <button onClick={handleSave} className="bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-3 rounded-xl font-bold shadow-md transition-colors">
                    Save Loan & Members
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 4. LOAN MANAGER (Individual Loan View)
    // ==========================================
    function LoanManager({ group, loan, members, payments, onBack, onAddPayment, onDeletePayment, onPrintLedger }) {
      const [activeTab, setActiveTab] = useState('overview');

      const [settleDate, setSettleDate] = useState(new Date().toISOString().split('T')[0]);
      const [totalLoanInterest, setTotalLoanInterest] = useState(0);
      const [totalSavingsDividend, setTotalSavingsDividend] = useState(0);

      const memberStats = useMemo(() => {
        return members.map(m => {
          const mPayments = payments.filter(p => p.memberId === m.id);
          const repaid = mPayments.reduce((sum, p) => sum + Number(p.loanPaid), 0);
          const saved = mPayments.reduce((sum, p) => sum + Number(p.savingsPaid), 0);
          return { ...m, repaid, saved, outstanding: m.loanShare - repaid };
        });
      }, [members, payments]);

      const loanStats = useMemo(() => {
        const totalRepaid = memberStats.reduce((sum, m) => sum + m.repaid, 0);
        const totalSaved = memberStats.reduce((sum, m) => sum + m.saved, 0);
        const progress = loan.totalAmount > 0 ? (totalRepaid / loan.totalAmount) * 100 : 0;
        return { totalRepaid, totalSaved, progress, outstanding: loan.totalAmount - totalRepaid };
      }, [memberStats, loan]);

      const handlePaymentSubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        onAddPayment({
          id: Date.now().toString(),
          loanId: loan.id,
          memberId: fd.get('memberId'),
          date: fd.get('date'),
          loanPaid: Number(fd.get('loanPaid')),
          savingsPaid: Number(fd.get('savingsPaid')),
        });
        e.target.reset();
      };

      const settlementData = useMemo(() => {
        if (!members.length) return [];
        
        const start = new Date(loan.startDate);
        const end = new Date(settleDate);
        if (end < start) return [];

        let groupLoanProduct = 0;
        let groupSavingsProduct = 0;

        const calcData = members.map(member => {
          const mPayments = payments
            .filter(p => p.memberId === member.id)
            .sort((a, b) => new Date(a.date) - new Date(b.date));

          let currentLoanBal = member.loanShare;
          let currentSavBal = 0;
          let mLoanProduct = 0;
          let mSavProduct = 0;
          
          let currentDate = new Date(start);
          let totalRepaid = 0;
          let totalSaved = 0;

          mPayments.forEach(p => {
            const payDate = new Date(p.date);
            
            if (payDate <= end) {
              const effectiveDate = payDate < currentDate ? currentDate : payDate;
              const days = calculateDays(currentDate, effectiveDate);
              
              mLoanProduct += (currentLoanBal * days);
              mSavProduct += (currentSavBal * days);

              totalRepaid += Number(p.loanPaid);
              totalSaved += Number(p.savingsPaid);
              
              currentLoanBal -= Number(p.loanPaid);
              currentSavBal += Number(p.savingsPaid);
              currentDate = effectiveDate;
            }
          });

          if (currentDate < end) {
            const days = calculateDays(currentDate, end);
            mLoanProduct += (currentLoanBal * days);
            mSavProduct += (currentSavBal * days);
          }

          mLoanProduct = Math.max(0, mLoanProduct);
          mSavProduct = Math.max(0, mSavProduct);

          groupLoanProduct += mLoanProduct;
          groupSavingsProduct += mSavProduct;

          return {
            ...member, totalRepaid, totalSaved, currentLoanBal, 
            mLoanProduct, mSavProduct
          };
        });

        return calcData.map(mc => {
          const interestOwed = groupLoanProduct > 0 
            ? (mc.mLoanProduct / groupLoanProduct) * totalLoanInterest 
            : 0;
            
          const dividendEarned = groupSavingsProduct > 0
            ? (mc.mSavProduct / groupSavingsProduct) * totalSavingsDividend
            : 0;
          
          const netFinalDue = Math.max(0, mc.currentLoanBal) + interestOwed - dividendEarned;

          return { ...mc, interestOwed, dividendEarned, netFinalDue };
        });

      }, [members, payments, loan, settleDate, totalLoanInterest, totalSavingsDividend]);

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col print:bg-white print:hidden">
          <div className="bg-emerald-700 text-white p-4 flex items-center gap-4 sticky top-0 z-10 shadow-md">
            <button onClick={onBack} className="p-2 hover:bg-emerald-600 rounded-full transition-colors"><ArrowLeft size={24}/></button>
            <div>
              <h1 className="text-xl font-bold">{loan.name}</h1>
              <p className="text-emerald-200 text-sm">Loan Management</p>
            </div>
          </div>

          <div className="bg-white border-b border-slate-200 overflow-x-auto">
            <div className="flex px-4 max-w-5xl mx-auto min-w-max">
              {['overview', 'members', 'payments', 'settlements'].map(tab => (
                <button key={tab} onClick={() => setActiveTab(tab)} className={`px-6 py-4 font-medium text-sm capitalize border-b-2 transition-colors ${activeTab === tab ? 'border-emerald-600 text-emerald-700' : 'border-transparent text-slate-500 hover:text-slate-700'}`}>
                  {tab}
                </button>
              ))}
            </div>
          </div>

          <div className="flex-1 p-4 md:p-8 max-w-5xl mx-auto w-full">
            
            {activeTab === 'overview' && (
              <div className="space-y-6 animate-in fade-in">
                 <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row justify-between items-center gap-6">
                    <div className="w-full md:w-1/2">
                      <p className="text-slate-500 mb-1">Total Loan Amount</p>
                      <p className="text-4xl font-bold text-slate-800 mb-4">{formatCurrency(loan.totalAmount)}</p>
                      <div className="w-full bg-slate-100 rounded-full h-4 mb-2 overflow-hidden">
                        <div className="bg-emerald-500 h-4 rounded-full transition-all duration-1000" style={{ width: `${loanStats.progress}%` }}></div>
                      </div>
                      <p className="text-sm text-slate-500 text-right">{Math.round(loanStats.progress)}% Recovered</p>
                    </div>
                    <div className="w-full md:w-1/2 grid grid-cols-2 gap-4">
                      <div className="bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                        <p className="text-emerald-800 text-sm">Recovered</p>
                        <p className="text-xl font-bold text-emerald-600">{formatCurrency(loanStats.totalRepaid)}</p>
                      </div>
                      <div className="bg-amber-50 p-4 rounded-xl border border-amber-100">
                        <p className="text-amber-800 text-sm">Outstanding</p>
                        <p className="text-xl font-bold text-amber-600">{formatCurrency(loanStats.outstanding)}</p>
                      </div>
                    </div>
                 </div>
              </div>
            )}

            {activeTab === 'members' && (
              <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden animate-in fade-in">
                <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                  <h2 className="text-lg font-bold text-slate-800">Members List & Ledgers</h2>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-left whitespace-nowrap">
                    <thead className="bg-white text-slate-500 text-sm border-b">
                      <tr>
                        <th className="p-4 font-medium">Name</th>
                        <th className="p-4 font-medium">Loan Share</th>
                        <th className="p-4 font-medium text-emerald-600">Repaid</th>
                        <th className="p-4 font-medium text-blue-600">Saved</th>
                        <th className="p-4 font-medium text-right">Action</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-50">
                      {memberStats.map(m => (
                        <tr key={m.id} className="hover:bg-slate-50">
                          <td className="p-4 font-bold text-slate-700">{m.name}</td>
                          <td className="p-4">{formatCurrency(m.loanShare)}</td>
                          <td className="p-4 text-emerald-600 font-medium">{formatCurrency(m.repaid)}</td>
                          <td className="p-4 text-blue-600">{formatCurrency(m.saved)}</td>
                          <td className="p-4 text-right">
                            <button onClick={() => onPrintLedger(m.id)} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-medium flex items-center gap-2 ml-auto transition-colors">
                              <Printer size={16} /> Print Passbook
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {activeTab === 'payments' && (
              <div className="grid md:grid-cols-3 gap-6 animate-in fade-in">
                <div className="md:col-span-1">
                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 sticky top-24">
                    <h3 className="text-lg font-bold mb-4 flex items-center gap-2"><CreditCard size={20} className="text-emerald-600"/> Log Payment</h3>
                    <form onSubmit={handlePaymentSubmit} className="space-y-4">
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">Select Member</label>
                        <select required name="memberId" className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                          <option value="">-- Choose --</option>
                          {members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">Date</label>
                        <input required name="date" type="date" defaultValue={new Date().toISOString().split('T')[0]} className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" />
                      </div>
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-1">Loan Paid</label>
                          <input required name="loanPaid" type="number" min="0" defaultValue="0" className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" />
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-1">Savings Paid</label>
                          <input required name="savingsPaid" type="number" min="0" defaultValue="100" className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" />
                        </div>
                      </div>
                      <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition-colors mt-2">
                        Record Payment
                      </button>
                    </form>
                  </div>
                </div>

                <div className="md:col-span-2">
                  <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                    <div className="p-6 border-b border-slate-100 bg-slate-50">
                      <h3 className="text-lg font-bold text-slate-800">Payment History</h3>
                    </div>
                    {payments.length === 0 ? (
                      <div className="p-8 text-center text-slate-500">No payments recorded yet.</div>
                    ) : (
                      <div className="overflow-x-auto">
                        <table className="w-full text-left whitespace-nowrap">
                          <thead className="bg-white text-slate-500 text-sm border-b">
                            <tr>
                              <th className="p-4 font-medium">Date</th>
                              <th className="p-4 font-medium">Member</th>
                              <th className="p-4 font-medium text-emerald-600">Loan Paid</th>
                              <th className="p-4 font-medium text-blue-600">Savings Paid</th>
                              <th className="p-4 font-medium text-right"></th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-50">
                            {payments.sort((a,b) => new Date(b.date) - new Date(a.date)).map(p => (
                              <tr key={p.id} className="hover:bg-slate-50">
                                <td className="p-4 text-sm">{new Date(p.date).toLocaleDateString('en-IN')}</td>
                                <td className="p-4 font-bold text-slate-700">{members.find(m => m.id === p.memberId)?.name}</td>
                                <td className="p-4 text-emerald-600 font-medium">{formatCurrency(p.loanPaid)}</td>
                                <td className="p-4 text-blue-600">{formatCurrency(p.savingsPaid)}</td>
                                <td className="p-4 text-right">
                                  <button onClick={() => onDeletePayment(p.id)} className="p-2 text-slate-400 hover:text-red-500 transition-colors rounded-full hover:bg-red-50">
                                    <Trash2 size={16} />
                                  </button>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'settlements' && (
              <div className="space-y-6 animate-in fade-in">
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                  <h3 className="text-xl font-bold mb-6 text-slate-800 flex items-center gap-2">
                    <Calculator className="text-emerald-600" /> Fair Distribution Engine
                  </h3>
                  <p className="text-sm text-slate-500 mb-6">Uses exact dates and amounts (Product Method) to calculate fair interest penalties for late loan payers and fair dividends for early savings contributors.</p>
                  
                  <div className="grid md:grid-cols-3 gap-6 bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">Settlement Date</label>
                      <input type="date" value={settleDate} onChange={e => setSettleDate(e.target.value)} className="w-full p-2.5 border border-slate-300 rounded-lg outline-none bg-white" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1 text-red-600">Total Bank Interest to Pay (₹)</label>
                      <input type="number" min="0" value={totalLoanInterest} onChange={e => setTotalLoanInterest(Number(e.target.value))} className="w-full p-2.5 border border-red-200 rounded-lg outline-none bg-white focus:ring-2 focus:ring-red-500" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1 text-blue-600">Total Savings Interest Earned (₹)</label>
                      <input type="number" min="0" value={totalSavingsDividend} onChange={e => setTotalSavingsDividend(Number(e.target.value))} className="w-full p-2.5 border border-blue-200 rounded-lg outline-none bg-white focus:ring-2 focus:ring-blue-500" />
                    </div>
                  </div>
                </div>

                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                  <div className="p-6 border-b border-slate-100 bg-slate-50">
                    <h3 className="text-lg font-bold text-slate-800">Final Settlement Report</h3>
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left whitespace-nowrap">
                      <thead className="bg-white text-slate-500 text-sm border-b">
                        <tr>
                          <th className="p-4 font-medium">Member</th>
                          <th className="p-4 font-medium">Prin. Bal.</th>
                          <th className="p-4 font-medium text-red-600 bg-red-50/30">Interest Owed (Penalty)</th>
                          <th className="p-4 font-medium text-blue-600 bg-blue-50/30">Dividend Earned (Reward)</th>
                          <th className="p-4 font-bold text-slate-800 text-right bg-slate-50">Net Final Settlement</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-50">
                        {settlementData.map(data => (
                          <tr key={data.id} className="hover:bg-slate-50">
                            <td className="p-4 font-bold text-slate-700">{data.name}</td>
                            <td className="p-4">{formatCurrency(data.currentLoanBal)}</td>
                            <td className="p-4 text-red-600 font-medium bg-red-50/10">+{formatCurrency(data.interestOwed)}</td>
                            <td className="p-4 text-blue-600 font-medium bg-blue-50/10">-{formatCurrency(data.dividendEarned)}</td>
                            <td className="p-4 font-bold text-right text-lg bg-slate-50/50">
                              {formatCurrency(data.netFinalDue)}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // 5. PRINT LEDGER COMPONENT (Hidden normally)
    // ==========================================
    function PrintLedger({ data, groupName }) {
      const { loan, member, payments } = data;
      
      return (
        <div className="hidden print:block p-8 max-w-4xl mx-auto bg-white min-h-screen text-black">
          <div className="text-center mb-8 border-b-2 border-black pb-4">
            <h1 className="text-3xl font-bold uppercase">{groupName}</h1>
            <h2 className="text-xl mt-2">Member Passbook / Ledger</h2>
          </div>

          <div className="flex justify-between mb-8 text-lg">
            <div>
              <p><strong>Member Name:</strong> {member.name}</p>
              <p><strong>Loan Account:</strong> {loan.name}</p>
            </div>
            <div className="text-right">
              <p><strong>Loan Share:</strong> {formatCurrency(member.loanShare)}</p>
              <p><strong>Target Monthly Savings:</strong> {formatCurrency(member.targetSavings)}</p>
              <p><strong>Start Date:</strong> {new Date(loan.startDate).toLocaleDateString('en-IN')}</p>
            </div>
          </div>

          <table className="w-full text-left border-collapse border border-black">
            <thead>
              <tr className="bg-gray-100">
                <th className="border border-black p-3">Date</th>
                <th className="border border-black p-3">Loan Principal Paid</th>
                <th className="border border-black p-3">Savings Deposited</th>
              </tr>
            </thead>
            <tbody>
              {payments.length === 0 ? (
                <tr><td colSpan="3" className="border border-black p-3 text-center">No transactions recorded.</td></tr>
              ) : (
                payments.map(p => (
                  <tr key={p.id}>
                    <td className="border border-black p-3">{new Date(p.date).toLocaleDateString('en-IN')}</td>
                    <td className="border border-black p-3">{formatCurrency(p.loanPaid)}</td>
                    <td className="border border-black p-3">{formatCurrency(p.savingsPaid)}</td>
                  </tr>
                ))
              )}
              
              <tr className="font-bold bg-gray-50">
                <td className="border border-black p-3 text-right">TOTALS</td>
                <td className="border border-black p-3">{formatCurrency(payments.reduce((s,p) => s + p.loanPaid, 0))}</td>
                <td className="border border-black p-3">{formatCurrency(payments.reduce((s,p) => s + p.savingsPaid, 0))}</td>
              </tr>
            </tbody>
          </table>
          
          <div className="mt-16 flex justify-between px-12">
            <div className="text-center">
              <div className="w-32 border-b border-black mb-2"></div>
              <p>Member Signature</p>
            </div>
            <div className="text-center">
              <div className="w-32 border-b border-black mb-2"></div>
              <p>Group Leader Signature</p>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // REUSABLE UI COMPONENTS
    // ==========================================
    function StatCard({ title, amount, icon, color, isCount }) {
      const colorMap = {
        blue: 'bg-blue-50 text-blue-700 border-blue-100',
        emerald: 'bg-emerald-50 text-emerald-700 border-emerald-100',
        purple: 'bg-purple-50 text-purple-700 border-purple-100',
      };

      return (
        <div className={`p-6 rounded-2xl border ${colorMap[color]} shadow-sm flex flex-col justify-between`}>
          <div className="flex justify-between items-start mb-4">
            <h3 className="font-semibold opacity-80">{title}</h3>
            <div className="opacity-80">{icon}</div>
          </div>
          <div className="text-3xl font-bold tracking-tight">
            {isCount ? amount : formatCurrency(amount)}
          </div>
        </div>
      );
    }

    // ==========================================
    // MOUNT TO DOM
    // ==========================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(registration => {
            console.log('Bulmi App Service Worker Registered.');
          })
          .catch(err => {
            console.error('Service Worker registration failed:', err);
          });
      });
    }
  </script>
</body>
</html>
